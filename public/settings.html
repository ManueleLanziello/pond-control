<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1115">
  <title>Impostazioni · Pond Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell settings-shell">
    <header class="hero settings-hero">
      <a class="back-link" href="/" aria-label="Torna alla dashboard">← Dashboard</a>
      <p class="eyebrow">POND CONTROL</p>
      <h1>Impostazioni</h1>
      <p class="subtitle">Configurazione locale dell’impianto</p>
    </header>

    <section class="settings-section" aria-labelledby="plugs-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PRESE TAPO</p>
          <h2 id="plugs-heading">Prese</h2>
        </div>
        <button class="settings-add-button" type="button" data-add-kind="plugs">Aggiungi presa</button>
      </div>
      <div id="settings-status" class="status-message" aria-live="polite">Caricamento configurazione…</div>
      <div id="plug-devices" class="settings-grid" aria-label="Registro hardware prese"></div>
    </section>

    <section class="settings-section" aria-labelledby="sensors-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">SENSORI</p>
          <h2 id="sensors-heading">Sensori</h2>
        </div>
        <button class="settings-add-button" type="button" data-add-kind="sensors">Aggiungi sensore</button>
      </div>
      <div id="sensor-devices" class="settings-grid" aria-label="Registro hardware sensori"></div>
    </section>

    <section class="settings-section" aria-labelledby="cameras-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TELECAMERE</p>
          <h2 id="cameras-heading">Telecamere</h2>
        </div>
        <button class="settings-add-button" type="button" data-add-kind="cameras">Aggiungi telecamera</button>
      </div>
      <div id="camera-devices" class="settings-grid" aria-label="Registro hardware telecamere"></div>
    </section>
  </main>
  <dialog id="hardware-dialog" class="hardware-dialog">
    <form id="hardware-form" method="dialog">
      <div class="section-heading">
        <div><p class="eyebrow" id="hardware-form-kind">DISPOSITIVO</p><h2 id="hardware-form-title">Aggiungi dispositivo</h2></div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Chiudi">×</button>
      </div>
      <input id="hardware-id" type="hidden"><input id="hardware-kind" type="hidden">
      <label>Alias<input id="hardware-alias" name="alias" required></label>
      <label>Modello / tipo<input id="hardware-model" name="model" required></label>
      <label>Indirizzo IP<input id="hardware-ip" name="ip" inputmode="decimal" required></label>
      <label>Indirizzo MAC<input id="hardware-mac" name="mac" placeholder="AA:BB:CC:DD:EE:FF" required></label>
      <label>Ruolo<select id="hardware-role" name="role"></select></label>
      <p id="hardware-form-status" class="status-message" aria-live="polite"></p>
      <div class="hardware-form-actions">
        <button id="hardware-verify" class="settings-action-button" type="button">Verifica</button>
        <button id="hardware-save" class="settings-add-button" type="submit">Salva</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/settings.js"></script>
</body>
</html>
